<html>
  <head>
    <meta charset="UTF-8" />
    <script>
      function decodeJWT(token) {
        const parts = token.split('.');
        if (parts.length !== 3) throw new Error('Invalid JWT');

        const payload64 = parts[1];

        let payloadStr;
        try {
          payloadStr = atob(payload64);
        } catch {
          throw new Error('Invalid base64 in JWT payload');
        }

        let payload;
        try {
          payload = JSON.parse(payloadStr);
        } catch {
          throw new Error('Invalid JSON in JWT payload');
        }

        return payload;
      }

      function googleSignup(response) {
        console.debug('Response:', response);

        const {credential} = response;
        const payload = decodeJWT(credential); // Must be try/catch!

        console.debug('Payload:', payload);

        const suggestedUsername = payload.email
          .split('@')[0]
          .substring(0, 16)
          .replace(/[^a-zA-Z0-9_]/g, '_');

        alert(
          `Hello, ${payload.given_name}! Suggested username: "${suggestedUsername}"`,
        );
      }
    </script>
  </head>
  <body>
    <!-- From https://developers.google.com/identity/gsi/web/guides/get-google-api-clientid#load_the_client_library -->
    <script src="https://accounts.google.com/gsi/client" async></script>

    <!--
      Generated from https://developers.google.com/identity/gsi/web/tools/configurator
      - Google client ID: 470216312957-f6qqrlbk391pb3h0q8gil23vrgg9e7bg.apps.googleusercontent.com
      - Data context: Sign up
      - Swap to JavaScript callback
      - Callback function: googleSignup
      - Next
      - Enable Sign in with Google button
      - Get code
    -->
    <!-- Maybe find a more elegant way to specify data-client-id, instead of hard coded string, even if it's not a secret, it's a public ID and server side verified -->
    <div
      id="g_id_onload"
      data-client_id="470216312957-f6qqrlbk391pb3h0q8gil23vrgg9e7bg.apps.googleusercontent.com"
      data-context="signup"
      data-ux_mode="popup"
      data-callback="googleSignup"
      data-auto_prompt="false"
    ></div>

    <div
      class="g_id_signin"
      data-type="standard"
      data-shape="pill"
      data-theme="filled_black"
      data-text="signup_with"
      data-size="large"
      data-logo_alignment="left"
    ></div>
  </body>
</html>
